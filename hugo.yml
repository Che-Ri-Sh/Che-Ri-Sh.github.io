baseURL: "https://Che-Ri-Sh.github.io/"
title: "CHERISH"
languageCode: "en-us"
theme: ["PaperMod"]

params:
  ShowReadingTime: true
  ShowCodeCopyButtons: true
  author: "CHERISH"
  ShowToc: true
  TocOpen: false
  math: true

markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - ['\[', '\]']
            - ['$$', '$$']
          inline:
            - ['\(', '\)']
            - ['$', '$']

menu:
  main:
    - name: Posts
      url: /posts/
      weight: 10
    - name: About
      url: /about/
      weight: 20
